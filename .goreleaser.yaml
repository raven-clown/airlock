version: 2

project_name: airlock

builds:
  - main: ./cmd/airlock
    binary: airlock
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# The release already exists: it is created by hand with gh release create, and
# the release workflow writes its notes from release.json.
release:
  mode: keep-existing
  # Without it, attaching assets clears the prerelease flag of a tag such as v0.2.0-rc.1.
  prerelease: auto
  # A rerun after a partial upload replaces the assets that made it instead of failing on them.
  replace_existing_artifacts: true
