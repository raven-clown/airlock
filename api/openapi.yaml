    get:
      operationId: getProfileBinding
      summary: One profile binding.
      responses:
        "200":
          description: The binding.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileBinding" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProfileBinding
      summary: Change a profile binding. The name cannot change.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object }
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The changed binding.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileBinding" }
        "400": { $ref: "#/components/responses/InvalidWrite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      operationId: deleteProfileBinding
      summary: Remove a profile binding.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
