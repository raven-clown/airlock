openapi: 3.1.0
info:
  title: airlock admin API
  version: v1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The JSON admin API of airlock, under /admin/v1/. It follows the admin API rules of the
    mothership contract.

    - Callers sign in as on `/mcp`: `Authorization: Bearer <API key or OIDC token>`. Access comes
      from role bindings. `member` may read `/me`, `/me/tools` and its own `/audit` records;
      `viewer` may call every GET and `POST /check`; every other write needs `admin`.
    - Lists take `cursor` and `limit` (default 50, at most 500) and return
      `{"items": [...], "next_cursor": "..."}`. `next_cursor` is absent on the last page.
    - Errors are `{"error": {"code": "...", "message": "...", "field": "..."}}`. A validation
      error names the field.
    - Every resource has an integer `version`, also sent as the `ETag` of a single read.
      PATCH, DELETE and revoke take it in `If-Match`; a mismatch is 409 `version_conflict`.
      Without `If-Match` the write applies to whatever version is stored.
    - PATCH bodies are JSON merge patches (RFC 7396).
    - Items declared in the YAML file are read-only here and marked `managed_by_file`; a write
      to one is 409 `managed_by_file`.
    - Every write is checked against the whole config as it would be, stored with its audit
      record in one transaction, and live on this instance before the answer. Other instances
      pick it up within 2 seconds.
servers:
  - url: /admin/v1
security:
  - bearer: []

paths:
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This file.
      responses:
        "200":
          description: The OpenAPI description of the admin API.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /status:
    get:
      operationId: getStatus
      summary: Version, uptime, revision, storage, the last reload and every backend.
      responses:
        "200":
          description: The status of this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tools:
    get:
      operationId: listTools
      summary: The whole catalog with prefixed names, sorted by name.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: server
          in: query
          description: Only the tools of this server.
          schema: { type: string }
      responses:
        "200":
          description: A page of tools.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tool" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /servers:
    get:
      operationId: listServers
      summary: Backend MCP servers, sorted by name. Secret values are never returned.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of servers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Server" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createServer
      summary: |
        Add a server. Values of `env`, and of headers whose name looks secret (Authorization,
        Cookie, or holding key, token, secret or auth), must be `${VAR}` references, resolved
        from airlock's environment when the server starts. A stdio command must match
        `stdio.allowed_commands` when the file sets it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerWrite" }
      responses:
        "201":
          description: The new server.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400": { $ref: "#/components/responses/InvalidWrite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /servers/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getServer
      summary: One server, with its current state.
      responses:
        "200":
          description: The server.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateServer
      summary: Change a server. The name cannot change.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object }
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The changed server.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "400": { $ref: "#/components/responses/InvalidWrite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      operationId: deleteServer
      summary: Remove a server. Its tools leave the catalog.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/InvalidWrite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /rules:
    get:
