          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileBinding" }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
